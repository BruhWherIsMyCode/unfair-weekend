[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unfair-weekend-backend"
version = "0.1.0"
description = "Python call, media and delivery modules for the check-in application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5,<1",
    "httpx>=0.28.1,<1",
    "uvicorn>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
]

[tool.setuptools.packages.find]
include = ["checkin_backend*"]

[tool.setuptools.package-data]
checkin_backend = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
