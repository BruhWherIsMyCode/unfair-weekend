# Generate the Xcode project: cd ios/App && xcodegen generate
name: OnasCalls
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OnasCalls:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: OnasCalls
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # The LocalAssets copy script below reads outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "Ona's calls"
        CFBundleDevelopmentRegion: en
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
    postCompileScripts:
      - name: Copy LocalAssets (clip.mp4, fedya.jpg) if present
        basedOnDependencyAnalysis: false
        script: |
          # Private files, never in git. The app shows placeholders when they are missing.
          SRC="${SRCROOT}/LocalAssets"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DST"
          for f in clip.mp4 fedya.jpg; do
            if [ -f "$SRC/$f" ]; then cp -f "$SRC/$f" "$DST/$f"; echo "LocalAssets: copied $f"
            else rm -f "$DST/$f"; echo "LocalAssets: $f missing, placeholder will show"; fi
          done
