# Generate the Xcode project: cd ios/ParentApp && xcodegen generate
name: ParentApp
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ParentCallKit:
    path: ../ParentCallKit
  # Simli's live avatar arrives over LiveKit (video and its voice).
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.18.0
targets:
  ParentApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: ParentApp
    dependencies:
      - package: ParentCallKit
        product: ParentCallKit
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        # The LocalAssets copy script below reads outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "HeartCall"
        CFBundleDevelopmentRegion: en
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # Demo workaround, not for the App Store: a silent audio loop keeps the app running in the background,
        # so the event stream stays open and an incoming call can ring through CallKit (no VoIP push needed).
        UIBackgroundModes:
          - audio
          - voip
        NSCameraUsageDescription: "The check-in call shows you on screen and looks at your smile and arms."
        NSMicrophoneUsageDescription: "The check-in call listens to your answers."
        NSLocalNetworkUsageDescription: "The check-in call connects to the check-in service on this network."
        NSAppTransportSecurity:
          # The demo backend runs on a laptop on the same network, over plain HTTP.
          NSAllowsLocalNetworking: true
    postCompileScripts:
      - name: Copy LocalAssets (avatar.mp4, avatar.jpg) if present
        basedOnDependencyAnalysis: false
        script: |
          # Private files, never in git. Without them the call shows the design's placeholder background.
          SRC="${SRCROOT}/LocalAssets"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DST"
          for f in avatar.mp4 avatar.jpg; do
            if [ -f "$SRC/$f" ]; then cp -f "$SRC/$f" "$DST/$f"; echo "LocalAssets: copied $f"
            else rm -f "$DST/$f"; fi
          done
  ParentAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParentAppUITests
    dependencies:
      - target: ParentApp
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(PARENT_BUNDLE_ID).uitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  ParentApp:
    build:
      targets:
        ParentApp: all
    test:
      targets:
        - ParentAppUITests
